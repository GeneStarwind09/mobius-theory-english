name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate, test and build from source
        shell: powershell
        run: .\tools\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Mobius-Theory-English-Windows-${{ github.sha }}
          path: |
            dist/Mobius-Theory-English.zip
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
